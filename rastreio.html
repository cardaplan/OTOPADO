<!doctype html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Rastreamento do Pedido</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/css/styles.css">
	<!--
		Rastreamento do Pedido (Cliente)
		- Linha do tempo horizontal com 5 etapas
		- Ponto piscante no status atual (animação @keyframes blink)
		- Barra de progresso animada entre etapas
		- Layout responsivo com Flex/Grid
		- Atualização automática a cada 5s
		- Pronto para backend real via dataService.js (localStorage por enquanto)
	-->
</head>
<body>
	<header class="header-bar">
		<div class="container header-inner">
			<div class="header-left">
				<span class="header-emoji">📦</span>
				<h1 class="header-title">Rastreamento do Pedido</h1>
			</div>
			<div class="header-right">
				<span id="order-code" class="order-code">#—</span>
				<a class="btn" href="/">Voltar ao cardápio</a>
			</div>
		</div>
	</header>

	<main class="container" style="padding-top:84px;">
		<section class="status-card" style="overflow:hidden;">
			<div class="status-row" style="align-items:flex-start;">
				<div>
					<div class="status-title">Acompanhe o progresso</div>
					<div id="status-friendly" class="status-badge">Carregando...</div>
				</div>
				<button id="refresh-btn" class="btn" title="Atualizar agora">⟳ Atualizar</button>
			</div>

			<!-- Linha do tempo -->
			<div class="timeline">
				<div class="timeline-track"></div>
				<div id="timeline-progress" class="timeline-progress"></div>
				<div id="timeline-indicator" class="timeline-indicator blinking"></div>
				<div class="timeline-steps">
					<div class="timeline-step" data-step="0">
						<div class="step-icon">🕒</div>
						<div class="step-label">Pedido criado</div>
					</div>
					<div class="timeline-step" data-step="1">
						<div class="step-icon">📦</div>
						<div class="step-label">Pedido confirmado</div>
					</div>
					<div class="timeline-step" data-step="2">
						<div class="step-icon">👨‍🍳</div>
						<div class="step-label">Em preparação</div>
					</div>
					<div class="timeline-step" data-step="3">
						<div class="step-icon">🚗</div>
						<div class="step-label">Saiu para entrega</div>
					</div>
					<div class="timeline-step" data-step="4">
						<div class="step-icon">✅</div>
						<div class="step-label">Entregue</div>
					</div>
				</div>
			</div>

			<div id="last-updated" class="subtle-text" style="margin-top:12px;">—</div>
		</section>
	</main>

	<script src="/js/dataService.js"></script>
	<script src="/js/script.js"></script>
	<script>
	// Mapeamento de status → índice da linha do tempo
	const STEP_IDS = ['criado','confirmado','preparacao','rota','entregue'];
	const STEP_COLORS = {
		criado: '#9CA3AF', // cinza
		confirmado: '#6366F1', // indigo (neutro elegante)
		preparacao: getComputedStyle(document.documentElement).getPropertyValue('--status-laranja').trim() || '#ff8c00',
		rota: getComputedStyle(document.documentElement).getPropertyValue('--status-azul').trim() || '#2d89ef',
		entregue: getComputedStyle(document.documentElement).getPropertyValue('--status-verde').trim() || '#22c55e'
	};

	const orderId = trackingUtils.getQueryParam('id');
	document.getElementById('order-code').textContent = orderId ? `#${orderId}` : '#—';

	function statusToIndex(status){
		switch(status){
			case 'confirmado': return 1;
			case 'preparacao': return 2;
			case 'rota': return 3;
			case 'entregue': return 4;
			default: return 0; // criado
		}
	}

	function indexToStatus(idx){
		return STEP_IDS[idx] || 'criado';
	}

	function labelForStatus(status){
		const map = {
			criado: '🕒 Pedido criado',
			confirmado: '📦 Pedido confirmado',
			preparacao: '👨‍🍳 Em preparação',
			rota: '🚗 Saiu para entrega',
			entregue: '✅ Entregue'
		};
		return map[status] || '—';
	}

	function applyTimeline(index){
		const total = STEP_IDS.length - 1;
		const percent = Math.max(0, Math.min(100, (index/total)*100));
		const currentStatus = indexToStatus(index);
		const color = STEP_COLORS[currentStatus] || '#111827';

		const progress = document.getElementById('timeline-progress');
		const indicator = document.getElementById('timeline-indicator');
		progress.style.width = percent + '%';
		progress.style.background = color;
		indicator.style.left = percent + '%';
		indicator.style.background = color;

		// Atualizar classes das etapas
		document.querySelectorAll('.timeline-step').forEach((el) => {
			const stepIdx = Number(el.getAttribute('data-step'));
			el.classList.toggle('completed', stepIdx < index);
			el.classList.toggle('current', stepIdx === index);
		});
	}

	function updateStatusLabel(status){
		const el = document.getElementById('status-friendly');
		el.textContent = labelForStatus(status);
		el.className = 'status-badge';
		if(status === 'preparacao') el.classList.add('badge-preparacao');
		if(status === 'rota') el.classList.add('badge-rota');
		if(status === 'entregue') el.classList.add('badge-entregue');
	}

	async function refresh(){
		try{
			if(!orderId){
				updateStatusLabel('criado');
				applyTimeline(0);
				document.getElementById('last-updated').textContent = 'ID de pedido não informado.';
				return;
			}
			const data = await window.dataService.getOrderStatus(orderId);
			const status = data?.status || 'confirmado';
			const idx = statusToIndex(status);
			applyTimeline(idx);
			updateStatusLabel(status);
			document.getElementById('last-updated').textContent = 'Atualizado em ' + new Date().toLocaleTimeString();
		}catch(e){
			console.error(e);
		}
	}

	document.getElementById('refresh-btn').addEventListener('click', refresh);
	refresh();
	setInterval(refresh, 5000);
	</script>
</body>
</html>
