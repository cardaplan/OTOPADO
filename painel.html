<!doctype html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Painel do Entregador</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/css/styles.css">
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-futuristic">
	<header class="header-bar">
		<div class="container header-inner">
			<div class="header-left">
				<span class="header-emoji">🚚</span>
				<h1 class="header-title">Painel do Entregador</h1>
			</div>
			<div class="header-right">
				<a class="btn" href="/">Voltar ao cardápio</a>
			</div>
		</div>
	</header>

	<main class="container" style="padding-top:84px;">
		<section class="status-card panel-card" style="overflow:hidden;">
			<label for="order-id" style="font-weight:700;">Buscar por ID</label>
			<div class="search-row">
				<input id="order-id" class="input" placeholder="Ex.: 250101-ABCD" inputmode="text" autocomplete="off" />
				<button id="load-btn" class="btn">Buscar</button>
			</div>

			<div class="current-status">
				<span class="muted">Status:</span>
				<span id="current-status-badge" class="status-badge">—</span>
			</div>

			<div class="status-grid">
				<button class="status-btn status-confirmado" data-status="confirmado">📦<span>Pedido confirmado</span></button>
				<button class="status-btn status-preparacao" data-status="preparacao">👨‍🍳<span>Em preparação</span></button>
				<button class="status-btn status-rota" data-status="rota">🚗<span>Saiu para entrega</span></button>
				<button class="status-btn status-entregue" data-status="entregue">✅<span>Entregue</span></button>
			</div>
			<button id="save-btn" class="btn btn-primary save-btn">Salvar</button>
			<div id="feedback" class="subtle-text" style="margin-top:12px;">—</div>
		</section>

		<section class="status-card" style="margin-top:16px;">
			<div class="status-row" style="justify-content:space-between;">
				<div class="status-title">Pedidos Disponíveis</div>
				<button id="refresh-list" class="btn">Atualizar lista</button>
			</div>
			<div id="orders-list" class="orders-list"></div>
		</section>

		<section class="status-card" style="margin-top:16px;">
			<div class="status-row" style="justify-content:space-between;">
				<div class="status-title">Histórico</div>
			</div>
			<div id="history-list" class="orders-list"></div>
		</section>
	</main>

	<div id="success-toast" class="success-toast" aria-hidden="true">✅</div>

	<div id="status-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
		<div class="modal">
			<div class="modal-header">
				<div class="modal-title">Atualizar Status</div>
				<button id="modal-close" class="btn">✕</button>
			</div>
			<div class="modal-body">
				<div class="subtle-text" id="modal-order-id">Pedido: —</div>
				<div class="status-grid" style="margin-top:10px;">
					<button class="status-btn" data-modal-status="confirmado">📦<span>Pedido confirmado</span></button>
					<button class="status-btn" data-modal-status="preparacao">👨‍🍳<span>Em preparação</span></button>
					<button class="status-btn" data-modal-status="rota">🚗<span>Saiu para entrega</span></button>
					<button class="status-btn" data-modal-status="entregue">✅<span>Entregue</span></button>
				</div>
			</div>
			<div class="modal-footer">
				<button id="modal-cancel" class="btn">Cancelar</button>
				<button id="modal-save" class="btn btn-primary">Salvar</button>
			</div>
		</div>
	</div>

	<script src="/js/dataService.js"></script>
	<script>
	let selectedStatus = '';
	const DELIVERER_ID = 'deliverer-1';

	function formatCurrencyBRL(v){ try{ return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }catch(e){ return 'R$ ' + Number(v||0).toFixed(2); } }
	function shortPhone(p){ return p ? `+${p}` : '—'; }
	function badgeFor(s){ const map = {confirmado:'📦 Pedido confirmado',preparacao:'👨‍🍳 Em preparação',rota:'🚗 Saiu para entrega',entregue:'✅ Entregue'}; return map[s]||'—'; }
	function applyBadge(el, s){ el.textContent = badgeFor(s); el.className='status-badge'; if(s==='preparacao')el.classList.add('badge-preparacao'); if(s==='rota')el.classList.add('badge-rota'); if(s==='entregue')el.classList.add('badge-entregue'); }

	async function loadStatus(){ const id=document.getElementById('order-id').value.trim(); const fb=document.getElementById('feedback'); if(!id){ fb.textContent='Informe o ID do pedido.'; return; } try{ const data=await window.dataService.getOrderStatus(id); const s=data?.status||'confirmado'; applyBadge(document.getElementById('current-status-badge'), s); selectedStatus=s; highlightSelected(s); fb.textContent='Status carregado.'; }catch(e){ fb.textContent='Falha ao carregar.'; } }
	function highlightSelected(s){ document.querySelectorAll('.status-btn').forEach(b=> b.classList.toggle('selected', b.getAttribute('data-status')===s)); }
	document.getElementById('load-btn').addEventListener('click', loadStatus);
	document.getElementById('order-id').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ loadStatus(); }});
	document.querySelectorAll('.status-btn').forEach(b=>{ b.addEventListener('click', ()=>{ selectedStatus=b.getAttribute('data-status'); highlightSelected(selectedStatus); });});
	document.getElementById('save-btn').addEventListener('click', async ()=>{ const id=document.getElementById('order-id').value.trim(); const fb=document.getElementById('feedback'); if(!id){ fb.textContent='Informe o ID do pedido.'; return; } if(!selectedStatus){ fb.textContent='Selecione um status.'; return; } try{ await window.dataService.updateOrderStatus(id, selectedStatus); applyBadge(document.getElementById('current-status-badge'), selectedStatus); showSuccess(); fb.textContent='Status atualizado com sucesso!'; }catch(e){ fb.textContent='Falha ao atualizar: '+e.message; } });
	function showSuccess(){ const t=document.getElementById('success-toast'); t.setAttribute('aria-hidden','false'); t.classList.add('show'); setTimeout(()=>{ t.classList.remove('show'); t.setAttribute('aria-hidden','true'); }, 1500); }
	function orderCard(o){ const accepted=!!o.acceptedBy; return `<div class="order-card ${accepted?'order-card-accepted':''}"><div class="order-main"><div class="order-top"><div class="order-id">#${o.id}</div><div class="order-amount">${formatCurrencyBRL(o.amount)}</div></div><div class="order-meta"><div><strong>${o.customerName}</strong> • ${shortPhone(o.customerPhone)}</div><div>Retirada: ${o.pickupAddress||'—'}</div><div>Entrega: ${o.deliveryAddress||'—'}</div></div></div><div class="order-actions">${accepted?`<span class="accepted-badge">Aceito</span>`:`<button class="btn btn-primary accept-btn" data-id="${o.id}">Aceitar</button>`}</div></div>`; }
	async function renderOrders(){ const list=document.getElementById('orders-list'); const hist=document.getElementById('history-list'); const orders=await window.dataService.listOrders(); const today=new Date(); today.setHours(0,0,0,0); const todays=orders.filter(o=>new Date(o.createdAt)>=today); const olds=orders.filter(o=>new Date(o.createdAt)<today); list.innerHTML=todays.map(orderCard).join('')||'<div class="subtle-text">Sem pedidos no momento</div>'; hist.innerHTML=olds.map(orderCard).join('')||'<div class="subtle-text">Sem histórico</div>'; list.querySelectorAll('.accept-btn').forEach(btn=>{ btn.addEventListener('click', async()=>{ const id=btn.getAttribute('data-id'); try{ await window.dataService.acceptOrder(id, DELIVERER_ID); showSuccess(); renderOrders(); openStatusModal(id);}catch(e){ alert(e.message);} });}); }
	document.getElementById('refresh-list').addEventListener('click', renderOrders);
	window.addEventListener('storage', (ev)=>{ if(ev.key==='orders_event'){ renderOrders(); } });
	window.dataService.seedDemoOrdersIfEmpty(); renderOrders();

	// Modal
	let modalOrderId=null; let modalSelectedStatus='';
	function openStatusModal(orderId){ modalOrderId=orderId; document.getElementById('modal-order-id').textContent=`Pedido: #${orderId}`; document.querySelectorAll('[data-modal-status]').forEach(b=>b.classList.remove('selected')); modalSelectedStatus=''; const o=document.getElementById('status-modal'); o.classList.add('show'); o.setAttribute('aria-hidden','false'); }
	function closeStatusModal(){ const o=document.getElementById('status-modal'); o.classList.remove('show'); o.setAttribute('aria-hidden','true'); modalOrderId=null; modalSelectedStatus=''; }
	document.getElementById('modal-close').addEventListener('click', closeStatusModal);
	document.getElementById('modal-cancel').addEventListener('click', closeStatusModal);
	document.querySelectorAll('[data-modal-status]').forEach(b=>{ b.addEventListener('click', ()=>{ modalSelectedStatus=b.getAttribute('data-modal-status'); document.querySelectorAll('[data-modal-status]').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); });});
	document.getElementById('modal-save').addEventListener('click', async ()=>{ if(!modalOrderId||!modalSelectedStatus){ closeStatusModal(); return; } try{ await window.dataService.updateOrderStatus(modalOrderId, modalSelectedStatus); showSuccess(); closeStatusModal(); if(document.getElementById('order-id').value.trim()===modalOrderId){ applyBadge(document.getElementById('current-status-badge'), modalSelectedStatus); highlightSelected(modalSelectedStatus);} renderOrders(); }catch(e){ alert('Falha ao atualizar status: '+e.message);} });
	</script>
</body>
</html>
