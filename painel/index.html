<!doctype html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Painel do Entregador</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../css/styles.css">
	<!--
		Painel do Entregador (Mobile-first)
		- Listagem de pedidos com aceite
		- Busca por ID e histórico
		- Seleção por botões grandes com ícones e atualização em tempo real
	-->
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-futuristic">
	<header class="header-bar">
		<div class="container header-inner">
			<div class="header-left">
				<span class="header-emoji">🚚</span>
				<h1 class="header-title">Painel do Entregador</h1>
			</div>
			<div class="header-right">
				<a class="btn" href="/">Voltar ao cardápio</a>
			</div>
		</div>
	</header>

	<main class="container" style="padding-top:84px;">
		<!-- Busca rápida por ID -->
		<section class="status-card panel-card" style="overflow:hidden;">
			<label for="order-id" style="font-weight:700;">Buscar por ID</label>
			<div class="search-row">
				<input id="order-id" class="input" placeholder="Ex.: 250101-ABCD" inputmode="text" autocomplete="off" />
				<button id="load-btn" class="btn">Buscar</button>
			</div>

			<div class="current-status">
				<span class="muted">Status:</span>
				<span id="current-status-badge" class="status-badge">—</span>
			</div>

			<div class="status-grid">
				<button class="status-btn status-confirmado" data-status="confirmado">📦<span>Pedido confirmado</span></button>
				<button class="status-btn status-preparacao" data-status="preparacao">👨‍🍳<span>Em preparação</span></button>
				<button class="status-btn status-rota" data-status="rota">🚗<span>Saiu para entrega</span></button>
				<button class="status-btn status-entregue" data-status="entregue">✅<span>Entregue</span></button>
			</div>
			<button id="save-btn" class="btn btn-primary save-btn">Salvar</button>
			<div id="feedback" class="subtle-text" style="margin-top:12px;">—</div>
		</section>

		<!-- Histórico -->
		<section class="status-card" style="margin-top:16px;">
			<div class="status-row" style="justify-content:space-between;">
				<div class="status-title">Histórico de Entregas</div>
				<div class="search-row">
					<input id="history-search" class="input" placeholder="Buscar ID no histórico" />
					<button id="history-search-btn" class="btn">Pesquisar</button>
				</div>
			</div>
			<div id="history-list" class="orders-list"></div>
		</section>
	</main>

	<div id="success-toast" class="success-toast" aria-hidden="true">✅</div>

	<!-- Modal de atualização de status após aceitar pedido -->
	<div id="status-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
		<div class="modal">
			<div class="modal-header">
				<div class="modal-title">Atualizar Status</div>
				<button id="modal-close" class="btn">✕</button>
			</div>
			<div class="modal-body">
				<div class="subtle-text" id="modal-order-id">Pedido: —</div>
				<div class="status-grid" style="margin-top:10px;">
					<button class="status-btn" data-modal-status="confirmado">📦<span>Pedido confirmado</span></button>
					<button class="status-btn" data-modal-status="preparacao">👨‍🍳<span>Em preparação</span></button>
					<button class="status-btn" data-modal-status="rota">🚗<span>Saiu para entrega</span></button>
					<button class="status-btn" data-modal-status="entregue">✅<span>Entregue</span></button>
				</div>
			</div>
			<div class="modal-footer">
				<button id="modal-cancel" class="btn">Cancelar</button>
				<button id="modal-save" class="btn btn-primary">Salvar</button>
			</div>
		</div>
	</div>

	<script src="../js/dataService.js"></script>
	<script>
	let selectedStatus = '';
	const DELIVERER_ID = 'deliverer-1'; // placeholder; em produção, viria de autenticação

	function formatCurrencyBRL(v){
		try{ return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }catch(e){ return 'R$ ' + Number(v||0).toFixed(2); }
	}
	function shortPhone(p){ return p ? `+${p}` : '—'; }

	function badgeFor(status){
		const map = { confirmado:'📦 Pedido confirmado', preparacao:'👨‍🍳 Em preparação', rota:'🚗 Saiu para entrega', entregue:'✅ Entregue' };
		return map[status] || '—';
	}
	function applyBadge(el, status){
		el.textContent = badgeFor(status);
		el.className = 'status-badge';
		if(status === 'preparacao') el.classList.add('badge-preparacao');
		if(status === 'rota') el.classList.add('badge-rota');
		if(status === 'entregue') el.classList.add('badge-entregue');
	}

	async function loadStatus(){
		const id = document.getElementById('order-id').value.trim();
		const feedback = document.getElementById('feedback');
		if(!id){ feedback.textContent = 'Informe o ID do pedido.'; return; }
		try{
			let data = await window.dataService.getOrderStatus(id);
			if(!data){
				// Inicializa pedido inexistente como 'criado'
				data = await window.dataService.ensureOrderInitialized(id);
			}
			const status = data?.status || 'criado';
			applyBadge(document.getElementById('current-status-badge'), status);
			selectedStatus = status; highlightSelected(status);
			feedback.textContent = 'Status carregado.';
		}catch(e){ feedback.textContent = 'Falha ao carregar.'; }
	}

	function highlightSelected(status){
		document.querySelectorAll('.status-btn').forEach(btn => {
			btn.classList.toggle('selected', btn.getAttribute('data-status') === status);
		});
	}

	document.getElementById('load-btn').addEventListener('click', loadStatus);
	document.getElementById('order-id').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ loadStatus(); }});
	document.querySelectorAll('.status-btn').forEach(btn => {
		btn.addEventListener('click', () => { selectedStatus = btn.getAttribute('data-status'); highlightSelected(selectedStatus); });
	});

	document.getElementById('save-btn').addEventListener('click', async () => {
		const id = document.getElementById('order-id').value.trim();
		const feedback = document.getElementById('feedback');
		if(!id){ feedback.textContent = 'Informe o ID do pedido.'; return; }
		if(!selectedStatus){ feedback.textContent = 'Selecione um status.'; return; }
		try{
			await window.dataService.updateOrderStatus(id, selectedStatus);
			applyBadge(document.getElementById('current-status-badge'), selectedStatus);
			showSuccess();
			feedback.textContent = 'Status atualizado com sucesso!';
		} catch(e){ feedback.textContent = 'Falha ao atualizar: ' + e.message; }
	});

	function showSuccess(){
		const toast = document.getElementById('success-toast');
		toast.setAttribute('aria-hidden','false'); toast.classList.add('show');
		setTimeout(()=>{ toast.classList.remove('show'); toast.setAttribute('aria-hidden','true'); }, 1500);
	}

	function orderCard(o){
		const accepted = !!o.acceptedBy;
		return `
			<div class="order-card ${accepted ? 'order-card-accepted' : ''}">
				<div class="order-main">
					<div class="order-top">
						<div class="order-id">#${o.id}</div>
						<div class="order-amount">${formatCurrencyBRL(o.amount)}</div>
					</div>
					<div class="order-meta">
						<div><strong>${o.customerName}</strong> • ${shortPhone(o.customerPhone)}</div>
						<div>Retirada: ${o.pickupAddress || '—'}</div>
						<div>Entrega: ${o.deliveryAddress || '—'}</div>
					</div>
				</div>
				<div class="order-actions">
					${accepted ? `<span class="accepted-badge">Aceito</span>` : `<button class="btn btn-primary accept-btn" data-id="${o.id}">Aceitar</button>`}
				</div>
			</div>
		`;
	}

	async function renderOrders(){
		const histEl = document.getElementById('history-list');
		const orders = await window.dataService.listOrders();
		// Filtrar apenas entregues
		const delivered = orders.filter(o => !!o.deliveredAt);
		histEl.innerHTML = delivered.map(orderCard).join('') || '<div class="subtle-text">Sem histórico</div>';
	}

	document.getElementById('refresh-list')?.addEventListener('click', renderOrders);
	document.getElementById('history-search-btn').addEventListener('click', ()=>{
		const q = (document.getElementById('history-search').value||'').trim().toLowerCase();
		const histEl = document.getElementById('history-list');
		if(!q){ renderOrders(); return; }
		const nodes = Array.from(histEl.children);
		nodes.forEach(n=> { n.style.display = n.textContent.toLowerCase().includes(q) ? '' : 'none'; });
	});

	// Listener de eventos (simula WebSocket) para atualizar listas automaticamente
	window.addEventListener('storage', (ev) => { if(ev.key === 'orders_event'){ renderOrders(); } });

	// Seed demo e render inicial
	window.dataService.seedDemoOrdersIfEmpty();
	renderOrders();

	// ===== Modal =====
	let modalOrderId = null;
	let modalSelectedStatus = '';

	function openStatusModal(orderId){
		modalOrderId = orderId;
		document.getElementById('modal-order-id').textContent = `Pedido: #${orderId}`;
		// limpar seleção prévia
		document.querySelectorAll('[data-modal-status]').forEach(btn=> btn.classList.remove('selected'));
		modalSelectedStatus = '';
		const overlay = document.getElementById('status-modal');
		overlay.classList.add('show');
		overlay.setAttribute('aria-hidden','false');
	}

	function closeStatusModal(){
		const overlay = document.getElementById('status-modal');
		overlay.classList.remove('show');
		overlay.setAttribute('aria-hidden','true');
		modalOrderId = null;
		modalSelectedStatus = '';
	}

	document.getElementById('modal-close').addEventListener('click', closeStatusModal);
	document.getElementById('modal-cancel').addEventListener('click', closeStatusModal);
	document.querySelectorAll('[data-modal-status]').forEach(btn => {
		btn.addEventListener('click', ()=>{
			modalSelectedStatus = btn.getAttribute('data-modal-status');
			document.querySelectorAll('[data-modal-status]').forEach(b=> b.classList.remove('selected'));
			btn.classList.add('selected');
		});
	});

	document.getElementById('modal-save').addEventListener('click', async ()=>{
		if(!modalOrderId || !modalSelectedStatus){ closeStatusModal(); return; }
		try{
			await window.dataService.updateOrderStatus(modalOrderId, modalSelectedStatus);
			if(modalSelectedStatus === 'entregue'){
				await window.dataService.markDelivered(modalOrderId, DELIVERER_ID);
			}
			showSuccess();
			closeStatusModal();
			if(document.getElementById('order-id').value.trim() === modalOrderId){
				applyBadge(document.getElementById('current-status-badge'), modalSelectedStatus);
				highlightSelected(modalSelectedStatus);
			}
			renderOrders();
		}catch(e){ alert('Falha ao atualizar status: ' + e.message); }
	});
	</script>
</body>
</html>
